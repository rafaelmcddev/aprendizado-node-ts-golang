<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Exemplo: front chamando backend (FastAPI)</title>
</head>
<body>
  <h1>Usuários</h1>
  <ul id="lista"></ul>
  <p><a href="/docs">Ver documentação Swagger (/docs)</a></p>

  <script>
    fetch('/users/')
      .then((r) => r.json())
      .then((users) => {
        const ul = document.getElementById('lista');
        ul.innerHTML = users.map((u) => `<li>${u.name} — ${u.email}</li>`).join('');
      });
  </script>
</body>
</html>
